name: DroidDeck Safety Tests

on:
  push:
    branches:
      - safety-phase0
    paths:
      - 'droiddeck/app/src/main/java/com/droiddeck/launcher/core/privileged/**'
      - 'droiddeck/app/src/test/java/com/droiddeck/launcher/core/privileged/**'
      - 'droiddeck/app/src/main/java/com/droiddeck/launcher/session/**'
      - 'droiddeck/app/src/test/java/com/droiddeck/launcher/session/**'
      - '.github/workflows/droiddeck-safety-tests.yml'
  pull_request:
    paths:
      - 'droiddeck/app/src/main/java/com/droiddeck/launcher/core/privileged/**'
      - 'droiddeck/app/src/test/java/com/droiddeck/launcher/core/privileged/**'
      - 'droiddeck/app/src/main/java/com/droiddeck/launcher/session/**'
      - 'droiddeck/app/src/test/java/com/droiddeck/launcher/session/**'
      - '.github/workflows/droiddeck-safety-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: droiddeck-safety-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety-unit-tests:
    name: Safety unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run safety unit tests
        run: |
          set -o pipefail
          cd droiddeck
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest \
            --tests "com.droiddeck.launcher.core.privileged.*" \
            --tests "com.droiddeck.launcher.session.*" \
            -PndkVersion=29.0.14206865 \
            -PskipRust=true \
            -PskipVerifyRuntimeInputs=true \
            -PallowMissingPacks=true \
            --stacktrace --no-daemon 2>&1 | tee /tmp/droiddeck-safety-tests.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droiddeck-safety-test-results
          path: |
            droiddeck/app/build/test-results/testDebugUnitTest/
            droiddeck/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
